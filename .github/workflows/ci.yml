name: Portfolio CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"
            - name: Installing dependencies...
              run: npm ci
            - name: building production build...
              run: npm run build
